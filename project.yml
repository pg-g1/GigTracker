name: GigTracker
options:
  bundleIdPrefix: com.gigtracker
targets:
  GigTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UIBackgroundModes:
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription: "Needed to track business kilometers automatically."
        NSLocationWhenInUseUsageDescription: "Needed to track business kilometers while the app is open."
        NSMotionUsageDescription: "Needed to detect when you start driving."
